<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Cayden's Clanker - pastpapergenie v3</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cayden's Clanker - browser AI assistant on pastpapergenie." />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js"></script>
    <!-- Puter.js for direct in-browser multi-model AI (GPT, Claude, Gemini, DeepSeek) -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
      #ai-container {
        display: flex;
        flex-direction: column;
        max-width: 900px;
        margin: 0 auto;
        padding: 8px 12px;
      }
      .ai-header-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
      }
      .ctrl-group {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      .ctrl-group label {
        font-weight: bold;
        color: var(--ink);
      }
      .ctrl-group select {
        padding: 4px 8px;
        font: inherit;
        border: 1px solid var(--bline);
        border-radius: var(--r);
        background: #fff;
        color: #111;
        cursor: pointer;
      }
      #ai-log {
        height: 55vh;
        min-height: 340px;
        overflow-y: auto;
        padding: 12px;
        border: 1px solid var(--line);
        background: var(--page);
        border-radius: var(--r);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .b {
        max-width: 88%;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: var(--r);
        overflow-wrap: anywhere;
        line-height: 1.5;
        font-size: 14px;
        position: relative;
      }
      .b.u {
        margin-left: auto;
        background: linear-gradient(135deg, rgba(30,144,255,0.15), rgba(30,144,255,0.05));
        border-color: rgba(30,144,255,0.3);
      }
      .b.a {
        margin-right: auto;
        background: var(--panel);
      }
      .b.e {
        margin-right: auto;
        background: rgba(176, 0, 32, 0.08);
        border-color: rgba(176, 0, 32, 0.3);
        color: #b00020;
      }
      .b .who {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: bold;
        color: var(--muted);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .b .copy-btn {
        background: none;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 10px;
        padding: 1px 6px;
        cursor: pointer;
        color: var(--muted);
      }
      .b .copy-btn:hover {
        background: var(--page);
        color: var(--ink);
      }
      .b pre {
        background: #1e1e1e;
        color: #f8f8f2;
        padding: 8px 10px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 13px;
        margin: 8px 0;
      }
      .b code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9em;
      }
      .b .ai-img {
        max-width: 100%;
        border-radius: 6px;
        margin-top: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      }
      #ai-form {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        align-items: flex-end;
      }
      #ai-text {
        flex: 1 1 260px;
        min-width: 0;
        min-height: 48px;
        max-height: 140px;
        resize: vertical;
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--bline);
        border-radius: var(--r);
        background: #fff;
        color: #111;
        line-height: 1.4;
      }
      #ai-text:focus {
        outline: none;
        border-color: #2680eb;
        box-shadow: 0 0 0 2px rgba(38,128,235,0.2);
      }
      .btn-bar {
        display: flex;
        gap: 6px;
      }
      #ai-note {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }
    </style>
  </head>
  <body>
    <div id="page">
      <header>
        <p class="logo"><a href="start.html">pastpapergenie <small>v3</small></a></p>
        <p class="blurb">Browser games and web search. follow @xrompf on tiktok</p>
      </header>
      <nav>
        <a href="start.html">Home</a>
        <a href="select.html">Games</a>
        <a href="anime.html">Anime</a>
        <a href="movies.html">Movies/Series</a>
        <a href="chat.html">Chat</a>
        <a href="search.html">Search</a>
        <a href="tools.html">Tools</a>
        <a href="ai.html" class="start" aria-current="page">AI</a>
        <a href="settings.html">Settings</a>
        <a href="about-us.html">About us</a>
      </nav>

      <div id="games">
        <main id="ai-container">
          <h1>Cayden's Clanker</h1>

          <div class="ai-header-controls">
            <div class="ctrl-group">
              <label for="ai-provider">Engine:</label>
              <select id="ai-provider">
                <option value="pollinations" selected>Pollinations.ai (Keyless & Instant)</option>
                <option value="puter">Puter.js (Multi-Model Engine)</option>
                <option value="backend">Google AI Studio / Backend</option>
              </select>
            </div>
            <span id="ai-counter" style="font-size:12px;color:var(--muted)">Ready</span>
          </div>

          <div id="ai-log" role="log" aria-live="polite"></div>

          <form id="ai-form">
            <textarea id="ai-text" maxlength="4000" placeholder="Ask Cayden's Clanker anything... (Enter to send, Shift+Enter for new line)" aria-label="Your question"></textarea>
            <div class="btn-bar">
              <button id="ai-send" class="go" type="submit">Send</button>
              <button id="ai-clear" type="button">Clear</button>
            </div>
          </form>

          <div id="ai-note">
            <span>Powered by Cayden's Clanker.</span>
          </div>
        </main>
      </div>

      <footer><p>Licence problem or takedown request: contact details are being set up and will be here soon.</p></footer>
    </div>

    <script>
      (function () {
        var $ = function (s) { return document.querySelector(s); };
        var history = [];
        var busy = false;
        var token = null;

        var SYSTEM_PROMPT = "You are Cayden's Clanker, a helpful and knowledgeable AI assistant on pastpapergenie. Keep answers clear, accurate, and direct.";

        function formatContent(text) {
          if (!text) return "";
          var div = document.createElement("div");
          div.textContent = text;
          var safe = div.innerHTML;

          safe = safe.replace(/```([a-z0-9]*)\n([\s\S]*?)```/gi, function (_, lang, code) {
            return "<pre><code>" + code + "</code></pre>";
          });
          safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
          safe = safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          safe = safe.replace(/\*([^*]+)\*/g, "<em>$1</em>");
          safe = safe.replace(/\n/g, "<br>");
          return safe;
        }

        function bubble(kind, text, isHtml) {
          var b = document.createElement("div");
          b.className = "b " + kind;
          var who = document.createElement("div");
          who.className = "who";

          var whoName = document.createElement("span");
          whoName.textContent = kind === "u" ? "You" : kind === "a" ? "Cayden's Clanker" : "Error";
          who.appendChild(whoName);

          if (kind === "a" && text !== "Thinking…") {
            var copyBtn = document.createElement("button");
            copyBtn.type = "button";
            copyBtn.className = "copy-btn";
            copyBtn.textContent = "Copy";
            copyBtn.onclick = function() {
              navigator.clipboard.writeText(text).then(function() {
                copyBtn.textContent = "Copied!";
                setTimeout(function() { copyBtn.textContent = "Copy"; }, 2000);
              });
            };
            who.appendChild(copyBtn);
          }

          var txt = document.createElement("div");
          txt.className = "txt";
          if (isHtml) {
            txt.innerHTML = text;
          } else {
            txt.innerHTML = formatContent(text);
          }

          b.appendChild(who);
          b.appendChild(txt);

          var log = $("#ai-log");
          log.appendChild(b);
          log.scrollTop = log.scrollHeight;
          return b;
        }

        async function queryPollinations(userText) {
          var msgs = [{ role: "system", content: SYSTEM_PROMPT }];
          history.slice(-8).forEach(function(m) {
            msgs.push({ role: m.role, content: m.content });
          });

          var res = await fetch("/api/ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: msgs,
              provider: "pollinations"
            })
          });

          if (!res.ok) {
            throw new Error("Service temporarily busy. Please try again.");
          }
          var data = await res.json();
          return { reply: data.reply, isHtml: false, left: data.left, provider: data.provider };
        }

        async function queryPuter(userText) {
          if (typeof puter === "undefined" || !puter.ai || !puter.ai.chat) {
            throw new Error("Puter.js is loading or not supported in this browser. Switching to Pollinations...");
          }

          var msgs = [{ role: "system", content: SYSTEM_PROMPT }];
          history.slice(-8).forEach(function(m) {
            msgs.push({ role: m.role, content: m.content });
          });

          var resp = await puter.ai.chat(msgs, {
            model: "gpt-4o-mini"
          });

          var output = (resp && resp.message && resp.message.content) || (typeof resp === "string" ? resp : "");
          if (!output) throw new Error("Puter returned an empty response");
          return { reply: output, isHtml: false };
        }

        async function queryBackend(userText) {
          var msgs = [{ role: "system", content: SYSTEM_PROMPT }];
          history.slice(-8).forEach(function(m) {
            msgs.push({ role: m.role, content: m.content });
          });

          var headers = { "Content-Type": "application/json" };
          if (token) headers["Authorization"] = "Bearer " + token;

          var res = await fetch("/api/ai", {
            method: "POST",
            headers: headers,
            body: JSON.stringify({ messages: msgs })
          });

          var data = await res.json().catch(function() { return {}; });
          if (!res.ok) throw new Error(data.error || "Server error");
          return { reply: data.reply, isHtml: false, left: data.left };
        }

        async function ask(text) {
          busy = true;
          $("#ai-send").disabled = true;
          history.push({ role: "user", content: text });
          bubble("u", text);

          var provider = $("#ai-provider").value;
          var wait = bubble("a", "Thinking…");

          try {
            var result = null;
            if (provider === "puter") {
              try {
                result = await queryPuter(text);
              } catch (puterErr) {
                console.warn("Puter fallback:", puterErr);
                result = await queryPollinations(text);
              }
            } else if (provider === "backend") {
              try {
                result = await queryBackend(text);
              } catch (backErr) {
                console.warn("Backend fallback:", backErr);
                result = await queryPollinations(text);
              }
            } else {
              result = await queryPollinations(text);
            }

            wait.remove();
            history.push({ role: "assistant", content: result.reply });
            bubble("a", result.reply, result.isHtml);

            if (typeof result.left === "number") {
              $("#ai-counter").textContent = result.left + " requests left";
            }
          } catch (e) {
            wait.remove();
            history.pop();
            bubble("e", e.message || "Could not reach the AI service. Please try again.");
          }

          busy = false;
          $("#ai-send").disabled = false;
          $("#ai-text").focus();
        }

        $("#ai-form").addEventListener("submit", function (e) {
          e.preventDefault();
          var t = $("#ai-text").value.trim();
          if (!t || busy) return;
          $("#ai-text").value = "";
          ask(t);
        });

        $("#ai-text").addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            $("#ai-form").requestSubmit();
          }
        });

        $("#ai-clear").addEventListener("click", function () {
          history = [];
          $("#ai-log").replaceChildren();
        });

        (function checkOptionalAuth() {
          try {
            var s = localStorage.getItem("sb-rdmvncnjmnpjqixfuzpt-auth-token");
            if (s) {
              var parsed = JSON.parse(s);
              if (parsed && parsed.access_token) {
                token = parsed.access_token;
                $("#ai-counter").textContent = "Connected with account";
              }
            }
          } catch(e) {}
        })();
      })();
    </script>

    <script>
      // dotgui-panic: global panic key
      document.addEventListener('keydown', function(e) {
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
        var key = '';
        try { key = localStorage.getItem('dotgui_panic_key') || 'k'; } catch (err) { key = 'k'; }
        if ((e.key || '').toLowerCase() !== (key || '').toLowerCase() || !key) return;
        try {
          document.title = 'Google';
          var f = document.querySelector("link[rel~='icon']");
          if (f) f.href = 'https://www.google.com/favicon.ico';
        } catch (err) {}
        var go = true, url = 'https://classroom.google.com';
        try {
          go = (localStorage.getItem('dotgui_panic_redirect') || 'true') === 'true';
          url = localStorage.getItem('dotgui_panic_url') || url;
        } catch (err) {}
        if (go && url) window.location.href = url;
      });
    </script>
    <script>
      (function() {
        const value = localStorage.getItem('tabCloaker') || 'default';
        const favicon = document.querySelector("link[rel~='icon']") || (() => {
          const link = document.createElement('link');
          link.rel = 'icon';
          document.head.appendChild(link);
          return link;
        })();
        if (value === 'google') {
          document.title = 'Google';
          favicon.href = 'https://www.google.com/favicon.ico';
        } else if (value === 'vocab') {
          document.title = 'My Learning | Vocabulary.com';
          favicon.href = 'https://www.vocabulary.com/favicon.ico';
        } else if (value === 'canvas') {
          document.title = 'Canvas';
          favicon.href = 'https://canvas.instructure.com/favicon.ico';
        } else if (value === 'drive') {
          document.title = 'Google Drive';
          favicon.href = 'https://drive.google.com/favicon.ico';
        } else if (value === 'docs') {
          document.title = 'Google Docs';
          favicon.href = 'https://docs.google.com/favicon.ico';
        } else {
          favicon.href = '/favicon.ico';
        }
      })();
    </script>
  </body>
</html>
